name: Veille stock Pokémon

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures à hh:07 (UTC)
  workflow_dispatch:       # bouton « Run workflow » pour tester

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérification des pages
        run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_BLOCKED: "0"
      - name: Sauvegarde de l'état
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "état $(date -u +%FT%H:%MZ)"
          git push
