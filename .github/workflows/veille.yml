name: Veille stock Pokémon

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (minimum accepté par GitHub)
  workflow_dispatch:       # bouton « Run workflow » pour tester
    inputs:
      test_notif:
        description: "Envoyer seulement une notification de test (boutons compris)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérification des pages
        run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_BLOCKED: "0"
          TEST_NOTIF: ${{ inputs.test_notif }}
      - name: Sauvegarde de l'état
        if: ${{ !inputs.test_notif }}
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "état $(date -u +%FT%H:%MZ)"
          git push
